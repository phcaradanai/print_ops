name: printops-app
services:
  app:
    image: registry.pg.xenex.io/printops-app:${PRINTOPS_APP_VERSION:-0.1.45}
    init: true
    environment:
      JWT_SECRET: "${PRINTOPS_APP_JWT_SECRET:?Set PRINTOPS_APP_JWT_SECRET to a unique random secret}"
      PRINTOPS_RUNNER_BOOTSTRAP_SECRET: "${PRINTOPS_RUNNER_BOOTSTRAP_SECRET:-}"
    ports:
      - "${PRINTOPS_APP_BIND_ADDRESS:-127.0.0.1}:${PRINTOPS_APP_PORT:-8081}:3001"
    volumes:
      - app_data:/data
      - type: bind
        source: /run/cups/cups.sock
        target: /run/cups/cups.sock
        bind:
          create_host_path: false
    restart: unless-stopped
volumes:
  app_data:
