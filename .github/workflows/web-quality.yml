name: Web quality

on:
  pull_request:
    branches:
      - mvp_nippon
    paths:
      - 'apps/web/**'
      - 'packages/domain/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-quality.yml'
  push:
    branches:
      - mvp_nippon
    paths:
      - 'apps/web/**'
      - 'packages/domain/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web dependencies
        run: |
          npm run build -w @printerops/domain
          npm run build -w @printerops/shared

      - name: Typecheck web
        run: npm run typecheck -w @printerops/web

      - name: Test web
        run: npm run test -w @printerops/web

      - name: Build web
        run: npm run build -w @printerops/web
