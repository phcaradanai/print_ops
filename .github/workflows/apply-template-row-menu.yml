name: Apply Template row menu

on:
  push:
    branches:
      - fix/templates-row-menu-popover

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/templates-row-menu-popover
          fetch-depth: 0

      - name: Apply exact row menu integration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/web/src/pages/Templates.tsx';
          let source = fs.readFileSync(path, 'utf8');

          function replaceOnce(from, to, label) {
            if (!source.includes(from)) throw new Error(`Replacement not found: ${label}`);
            source = source.replace(from, to);
          }

          replaceOnce(
            "import { TransferIcon } from '../components/TransferIcon.js';",
            "import { TransferIcon } from '../components/TransferIcon.js';\nimport { TemplateRowMenu } from './TemplateRowMenu.js';",
            'TemplateRowMenu import',
          );

          replaceOnce(
            "  const [menuFor, setMenuFor] = useState<string | null>(null);\n",
            '',
            'legacy menu state',
          );

          replaceOnce(
            `  // Row "more" menu closes on any outside click, like a native popup menu.\n  useEffect(() => {\n    if (!menuFor) return;\n    const close = () => setMenuFor(null);\n    document.addEventListener('click', close);\n    return () => document.removeEventListener('click', close);\n  }, [menuFor]);\n\n`,
            '',
            'legacy outside-click effect',
          );

          const menuCloseLine = '    setMenuFor(null);\n';
          const menuCloseCount = source.split(menuCloseLine).length - 1;
          if (menuCloseCount !== 3) throw new Error(`Expected 3 legacy menu close lines, found ${menuCloseCount}`);
          source = source.replaceAll(menuCloseLine, '');

          replaceOnce(
            `                      <div className="tpl-menu-wrap" onClick={(e) => e.stopPropagation()}>\n                        <IconButton\n                          size="sm"\n                          label={t('page.templates.moreTemplateActions').replace('{name}', tpl.name)}\n                          title={t('page.templates.more')}\n                          aria-expanded={menuFor === tpl.id}\n                          aria-haspopup="menu"\n                          onClick={() => setMenuFor(menuFor === tpl.id ? null : tpl.id)}\n                        ><TemplateIcon name="more" /></IconButton>\n                        {menuFor === tpl.id && (\n                          <div className="tpl-menu" role="menu">\n                            <button type="button" role="menuitem" onClick={() => void publish(tpl.id)}>\n                              <TemplateIcon name="check" /> {t('common.publish')}\n                            </button>\n                            <button\n                              type="button"\n                              role="menuitem"\n                              className="tpl-menu__danger"\n                              onClick={() => { setMenuFor(null); setPendingDelete(tpl); }}\n                            >\n                              <TemplateIcon name="delete" /> {t('page.templates.delete')}\n                            </button>\n                          </div>\n                        )}\n                      </div>`,
            `                      <TemplateRowMenu\n                        label={t('page.templates.moreTemplateActions').replace('{name}', tpl.name)}\n                        icon={<TemplateIcon name="more" />}\n                        items={[\n                          {\n                            id: 'publish',\n                            label: t('common.publish'),\n                            icon: <TemplateIcon name="check" />,\n                            onSelect: () => void publish(tpl.id),\n                          },\n                          {\n                            id: 'delete',\n                            label: t('page.templates.delete'),\n                            icon: <TemplateIcon name="delete" />,\n                            danger: true,\n                            restoreFocus: false,\n                            onSelect: () => setPendingDelete(tpl),\n                          },\n                        ]}\n                      />`,
            'row menu markup',
          );

          fs.writeFileSync(path, source);
          NODE

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/Templates.tsx
          git commit -m "fix(web): move Template row menu above table overflow"
          git push origin HEAD:fix/templates-row-menu-popover
