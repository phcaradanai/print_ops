name: Publish PrintOps App image
on:
  push:
    branches: ['codex/printops-app-linux-*']
    paths: ['.github/workflows/publish-app-image.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-printops-app-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/runner-go/go.mod
      - uses: docker/setup-buildx-action@v3
      - name: Test Go runner
        working-directory: apps/runner-go
        run: go test ./...
      - name: Set release version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE=registry.pg.xenex.io/printops-app:$VERSION" >> "$GITHUB_ENV"
      - name: Build Linux application
        run: |
          docker buildx build --platform linux/amd64 --load \
            --file infra/docker/Dockerfile.app \
            --build-arg APP_VERSION="$VERSION" \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --tag "$IMAGE" .
      - name: Verify application and persistence before publishing
        run: node scripts/smoke-app-image.mjs "$IMAGE"
      - name: Validate deployment configuration
        env:
          PRINTOPS_APP_JWT_SECRET: compose-validation-only
        run: docker compose -f infra/docker/docker-compose.app.yml config --quiet
      - name: Push verified image
        run: |
          docker push "$IMAGE"
          docker buildx imagetools inspect "$IMAGE" | tee published-app-image.txt
          cat published-app-image.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: published-app-image
          path: published-app-image.txt
