name: Apply Templates hotfix

on:
  push:
    branches:
      - fix/templates-preview-consistency

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/templates-preview-consistency
          fetch-depth: 0

      - name: Apply exact Templates fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/web/src/pages/Templates.tsx';
          let source = fs.readFileSync(path, 'utf8');

          function replaceOnce(pattern, replacement, label) {
            const next = source.replace(pattern, replacement);
            if (next === source) throw new Error(`Replacement not found: ${label}`);
            source = next;
          }

          replaceOnce(
            "import { errorMessage } from '../api/errors.js';",
            "import { ApiError, errorMessage } from '../api/errors.js';",
            'ApiError import',
          );

          replaceOnce(
            /^const PLACEHOLDER_PATTERN = .*?;\n\n/m,
            '',
            'obsolete placeholder pattern',
          );

          replaceOnce(
            /function placeholdersOf\(content: string\): string\[\] \{\n  return .*?;\n\}/s,
            `export function placeholdersOf(content: string): string[] {\n  return Array.from(new Set(\n    Array.from(content.matchAll(COMBINED_PREVIEW_PATTERN))\n      .map((match) => match[2] ?? match[3] ?? '')\n      .filter(Boolean),\n  ));\n}`,
            'combined placeholder collector',
          );

          replaceOnce(
            /function buildSample\(\n  mode: SampleMode,\n  content: string,\n  profile\?: PaperProfileOption,\n\): Record<string, unknown> \{\n  if \(mode === 'empty'\) return \{\};\n  const payload: Record<string, unknown> = \{\};\n  if \(mode === 'profile' && profile\) \{\n    for \(const field of profile.fields \?\? \[\]\) \{\n      if \(field.key\) payload\[field.key\] = field.defaultValue \?\? field.label \?\? field.key;\n    \}\n    return payload;\n  \}/,
            `export function buildSample(\n  mode: SampleMode,\n  content: string,\n  profile?: PaperProfileOption,\n): Record<string, unknown> {\n  if (mode === 'empty') return {};\n  const payload: Record<string, unknown> = {};\n  if (mode === 'profile') {\n    if (!profile) return {};\n    for (const field of profile.fields ?? []) {\n      if (field.key) payload[field.key] = field.defaultValue ?? field.label ?? field.key;\n    }\n    return payload;\n  }`,
            'profile sample behavior',
          );

          replaceOnce(
            "function formatDate(value: string | undefined, locale: string): string {",
            `export function classifyTemplateDeleteFailure(err: unknown): 'bound' | 'forbidden' | 'generic' {\n  if (!(err instanceof ApiError)) return 'generic';\n  if (err.status === 409) return 'bound';\n  if (err.status === 403) return 'forbidden';\n  return 'generic';\n}\n\nfunction formatDate(value: string | undefined, locale: string): string {`,
            'delete failure classifier',
          );

          replaceOnce(
            "  const libraryRef = useRef<HTMLElement | null>(null);",
            "  const libraryRef = useRef<HTMLElement | null>(null);\n  const previewRequestIdRef = useRef(0);",
            'preview request ref',
          );

          replaceOnce(
            "  function showLocalPreview() {\n    const sample = buildSample(sampleMode, form.content, formProfile);",
            "  function showLocalPreview() {\n    previewRequestIdRef.current += 1;\n    const sample = buildSample(sampleMode, form.content, formProfile);",
            'local preview invalidation',
          );

          replaceOnce(
            "  async function renderServerPreview(tpl: Template, mode: SampleMode = sampleMode, revealWorkspace = true) {\n    setSelectedId(tpl.id);",
            "  async function renderServerPreview(tpl: Template, mode: SampleMode = sampleMode, revealWorkspace = true) {\n    const requestId = ++previewRequestIdRef.current;\n    setSelectedId(tpl.id);",
            'server preview request id',
          );

          replaceOnce(
            "      });\n      setPreview(res);",
            "      });\n      if (requestId !== previewRequestIdRef.current) return;\n      setPreview(res);",
            'ignore stale preview success',
          );

          replaceOnce(
            "    } catch (err: unknown) {\n      setPreview(null);\n      setPreviewHtml('');\n      setPreviewError(`${t('page.templates.previewFailed')} ${errorMessage(err)}`);\n    }\n  }\n\n  function refreshPreview(mode: SampleMode) {",
            "    } catch (err: unknown) {\n      if (requestId !== previewRequestIdRef.current) return;\n      setPreview(null);\n      setPreviewHtml('');\n      setPreviewError(`${t('page.templates.previewFailed')} ${errorMessage(err)}`);\n    }\n  }\n\n  function refreshPreview(mode: SampleMode) {",
            'ignore stale preview failure',
          );

          replaceOnce(
            "    if (selected) {\n      void renderServerPreview(selected, mode, false);\n      return;\n    }\n    const sample = buildSample(mode, form.content, formProfile);",
            "    if (selected && !formDirty) {\n      void renderServerPreview(selected, mode, false);\n      return;\n    }\n    previewRequestIdRef.current += 1;\n    setSelectedId(null);\n    setPreview(null);\n    setPreviewError('');\n    const sample = buildSample(mode, form.content, formProfile);",
            'refresh unsaved preview locally',
          );

          replaceOnce(
            "      setForm({ ...EMPTY_FORM });\n      setEditingId(null);\n      await load();",
            "      previewRequestIdRef.current += 1;\n      setForm({ ...EMPTY_FORM });\n      setEditingId(null);\n      await load();",
            'invalidate preview after save',
          );

          replaceOnce(
            "  function startEdit(tpl: Template) {\n    setWorkspaceOpen(true);",
            "  function startEdit(tpl: Template) {\n    previewRequestIdRef.current += 1;\n    setWorkspaceOpen(true);",
            'invalidate preview on edit',
          );

          replaceOnce(
            "  function newTemplate() {\n    setWorkspaceOpen(true);",
            "  function newTemplate() {\n    previewRequestIdRef.current += 1;\n    setWorkspaceOpen(true);",
            'invalidate preview on create',
          );

          replaceOnce(
            "  function closeWorkspace() {\n    setWorkspaceOpen(false);",
            "  function closeWorkspace() {\n    previewRequestIdRef.current += 1;\n    setWorkspaceOpen(false);",
            'invalidate preview on close',
          );

          replaceOnce(
            "      if (selectedId === target.id) {\n        setSelectedId(null);",
            "      if (selectedId === target.id) {\n        previewRequestIdRef.current += 1;\n        setSelectedId(null);",
            'invalidate preview on delete',
          );

          replaceOnce(
            /    \} catch \(err\) \{\n      const status = String\(err instanceof Error \? err.message : ''\);\n      const text = status.endsWith\('409'\)\n        \? t\('page.templates.deleteBound'\)\n        : status.endsWith\('403'\)\n          \? t\('page.templates.deleteForbidden'\)\n          : t\('page.templates.actionFailed'\);/,
            `    } catch (err) {\n      const failure = classifyTemplateDeleteFailure(err);\n      const text = failure === 'bound'\n        ? t('page.templates.deleteBound')\n        : failure === 'forbidden'\n          ? t('page.templates.deleteForbidden')\n          : t('page.templates.actionFailed');`,
            'typed delete error mapping',
          );

          fs.writeFileSync(path, source);
          NODE

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/Templates.tsx
          git commit -m "fix(web): harden template preview consistency"
          git push origin HEAD:fix/templates-preview-consistency
