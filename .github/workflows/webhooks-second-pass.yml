name: Webhooks second-pass verification

on:
  push:
    branches:
      - mvp_nippon
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: npm ci
      - name: Root typecheck
        run: npm run typecheck
      - name: Root tests
        run: npm run test
      - name: Root build
        run: npm run build
      - name: Web build
        run: npm run build -w @printerops/web

  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build package dependencies
        run: npm run build:packages
      - name: Build web for visual review
        run: npm exec -w @printerops/web vite build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture current Webhooks UI
        run: npx playwright test apps/web/e2e/webhooks-second-pass-review.spec.ts --project=chromium
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webhooks-second-pass-browser-evidence
          path: |
            artifacts/ui-unification/webhooks-second-pass
            artifacts/browser
          if-no-files-found: warn
          retention-days: 14
