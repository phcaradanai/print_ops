name: Webhooks verification

on:
  push:
    branches:
      - mvp_nippon
    paths:
      - '.github/workflows/webhooks-verification.yml'
      - 'apps/web/**'
      - 'packages/**'
      - 'apps/api/**'
      - 'apps/runner-go/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/webhooks-verification.yml'
      - 'apps/web/**'
      - 'packages/**'
      - 'apps/api/**'
      - 'apps/runner-go/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests, build, and browser evidence
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/runner-go/go.mod
          cache-dependency-path: apps/runner-go/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript workspace dependencies
        run: npm run build:packages

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Build packaged SPA test fixture
        run: npm run build -w @printerops/web

      - name: Test domain workspace
        run: npm run test -w packages/domain

      - name: Test shared workspace
        run: npm run test -w packages/shared

      - name: Test adapters workspace
        run: npm run test -w packages/adapters

      - name: Test API workspace
        shell: bash
        run: |
          mkdir -p artifacts/verification
          set -o pipefail
          npm run test -w apps/api -- --reporter=verbose 2>&1 | tee artifacts/verification/api-tests.log

      - name: Test web workspace
        run: npm run test -w apps/web

      - name: Test desktop workspace
        run: npm run test -w apps/desktop --if-present

      - name: Test Go runner
        run: npm run test:runner-go

      - name: Test all workspaces through root command
        run: npm run test

      - name: Test webhook and callback API contracts
        working-directory: apps/api
        run: >-
          npx vitest run
          src/tests/webhook-callback-api.test.ts
          src/tests/webhook-callback.test.ts
          src/tests/webhook-endpoint.repo.test.ts
          src/tests/callback-delivery.repo.test.ts
          src/tests/callback-toggle.test.ts
          src/tests/callback-url-guard.test.ts
          src/tests/result-callback.test.ts

      - name: Build runtime packages
        run: npm run build

      - name: Build web application
        run: npm run build -w @printerops/web

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Webhooks browser verification
        run: >-
          npx playwright test
          apps/web/e2e/webhooks-redesign.spec.ts
          apps/web/e2e/webhooks-final-visual.spec.ts

      - name: Upload Webhooks visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webhooks-second-pass-ui-evidence
          path: |
            artifacts/ui-unification/webhooks-second-pass
            artifacts/browser/test-results
            artifacts/browser/report
            artifacts/verification
          if-no-files-found: warn
          retention-days: 14
