server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: send all non-file requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the API service reachable from this web container.
    location /api/ {
        # No trailing slash: preserve the /api prefix expected by the backend.
        proxy_pass http://${PRINTOPS_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Installer imports use Base64 JSON; keep the larger limit route-specific.
        location = /api/v1/control/releases/import {
            client_max_body_size ${PRINTOPS_RELEASE_IMPORT_MAX_MIB}m;
            proxy_pass http://${PRINTOPS_API_UPSTREAM};
        }
    }

}
