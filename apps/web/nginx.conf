server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: send all non-file requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to printops-api backend
    location /api/ {
        proxy_pass http://printops-api:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The desktop/API bundle serves these legacy dashboard endpoints at the
    # origin root. The standalone web image must forward the same contract;
    # otherwise nginx's SPA fallback returns index.html with HTTP 200 and the
    # client reports INVALID_JSON for requests such as /jobs?limit=500.
    location ~ ^/(auth|health|me|jobs|printers|runners|commands|audit-logs)(/|$) {
        proxy_pass http://printops-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
