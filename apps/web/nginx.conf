server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the API service per request instead of once at startup.
    #
    # Nginx resolves a static `proxy_pass` host when it loads the config and keeps that
    # address forever. Recreating the API container (a normal image upgrade, or
    # `up -d api` on its own) gives it a new IP, and the still-running web container then
    # proxies every API call to the old address — which may now belong to a different
    # container or to nothing at all. The dashboard then shows no data at all even though
    # the API and its database are healthy. `resolver` + a variable in `proxy_pass` moves
    # resolution to request time, so the proxy follows the current address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $printops_api "http://${PRINTOPS_API_UPSTREAM}";

    # SPA routing: send all non-file requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the API service reachable from this web container.
    location /api/ {
        # No trailing slash: preserve the /api prefix expected by the backend.
        proxy_pass $printops_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A recreated API can take a few seconds to accept connections.
        proxy_next_upstream error timeout http_502 http_503 http_504;

        # Installer imports use Base64 JSON; keep the larger limit route-specific.
        location = /api/v1/control/releases/import {
            client_max_body_size ${PRINTOPS_RELEASE_IMPORT_MAX_MIB}m;
            proxy_pass $printops_api;
        }
    }

}
